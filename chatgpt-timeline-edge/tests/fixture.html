<!doctype html>
<html lang="zh-CN" class="light">
<meta charset="UTF-8">
<title>ChatGPT 消息书签 · 本地兼容性测试</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: #28333b; font: 15px/1.8 system-ui, sans-serif; }
  header { height: 64px; padding: 18px 32px; border-bottom: 1px solid #edf0f2; }
  header span { float: right; margin-right: 72px; color: #83908c; font-size: 12px; }
  main { height: calc(100vh - 64px); overflow-y: auto; padding: 40px max(100px, calc((100vw - 720px) / 2)); }
  ol { list-style: none; padding: 0; margin: 0; }
  [data-message-role='user'], [data-message-author-role='user'] { display: flex; justify-content: flex-end; margin: 24px 0; }
  [data-user-message-bubble], .whitespace-pre-wrap { max-width: 85%; background: #f2f4f5; color: inherit;
    padding: 12px 20px; border: 0; border-radius: 22px; font: inherit; text-align: left; }
  [data-user-message-copy] { margin: 0; white-space: pre-wrap; }
  [data-message-role='assistant'] { min-height: 280px; padding: 16px 0 40px; }
  [data-message-attribution] { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  html.dark body { background: #171a1d; color: #dfe6ea; }
  html.dark [data-user-message-bubble] { background: #2b3035; }
  .tail { height: 400px; }
  form { position:fixed; bottom:16px; left:25%; width:50%; display:flex; gap:8px; background:inherit; padding:8px; border:1px solid #ccd4d8; border-radius:16px; }
  textarea { width:100%; resize:none; padding:8px; border:0; background:transparent; color:inherit; }
  form button { border:0; border-radius:10px; padding:8px 14px; background:#147d6b; color:white; white-space:nowrap; flex:none; }
</style>
<header>ChatGPT <span>本地演示 · 模拟对话内容</span></header>
<main><ol data-conversation-transcript>
  <li data-message-role="user" id="turn-1">
    <h4 data-message-attribution>你说：</h4>
    <button data-user-message-bubble><p data-user-message-copy>我想做一个 ChatGPT 消息书签，可以快速找到之前问过的问题。</p></button>
    <div popover><button aria-label="复制消息">复制消息</button></div>
  </li>
  <li data-message-role="assistant"><p>可以在右侧放一条简洁的时间轴，每个圆点对应一条你发出的消息。</p><p>悬停预览消息，点击圆点回到原来的位置。</p><span class="katex"><span class="katex-html">E = mc²</span><math style="display:none"><semantics><annotation encoding="application/x-tex">E = mc^2</annotation></semantics></math></span></li>
  <li data-message-role="user" id="turn-2"><button data-user-message-bubble><p data-user-message-copy>如果 ChatGPT 更新了页面结构，怎么让它继续正常工作？</p></button></li>
  <li data-message-role="assistant"><p>兼容新旧消息角色属性，监听会话变化，并自动查找实际的滚动容器。</p></li>
  <li data-message-role="user" id="turn-3"><button data-user-message-bubble><p data-user-message-copy>长对话也能用吗？我希望能看到现在读到了哪里。</p></button></li>
  <li data-message-role="assistant"><p>当前消息会高亮显示，时间轴可以单独滚动，也可以用方向键导航。</p></li>
  <li data-message-role="user" id="turn-4"><button data-user-message-bubble><p data-user-message-copy>好的，请把悬停预览和深色模式也加上。</p></button></li>
  <li data-message-role="assistant"><p>已加入。点击顶部书签图标还可以折叠时间轴。</p></li>
</ol><div class="tail"></div></main>
<form><textarea id="mobile-composer-prompt" aria-label="与 ChatGPT 聊天" placeholder="输入消息…"></textarea><button type="submit" data-testid="send-button" aria-label="发送消息">发送</button></form>
<script>
  const composer = document.querySelector('textarea');
  document.querySelector('form').addEventListener('submit', event => { event.preventDefault(); document.body.dataset.sent = String(Number(document.body.dataset.sent || 0) + 1); });
  composer.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); document.querySelector('form').requestSubmit(); }
  });
  composer.addEventListener('input', () => { composer.dataset.lastInput = composer.value; });
</script>
</html>
